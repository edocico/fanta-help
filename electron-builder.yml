appId: it.fantahelp.app
productName: Fanta Help
directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

extraResources:
  - from: drizzle
    to: drizzle

asar: true
# All three entries are required: better-sqlite3 loads its binary through
# `bindings`, which in turn uses `file-uri-to-path`. Miss one and the app
# starts in dev and crashes in production.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/bindings/**"
  - "**/node_modules/file-uri-to-path/**"

npmRebuild: true

# Documento 3 §8. Le Release di una repo pubblica si leggono senza token: nessun
# server, nessun costo, nessuna autenticazione. Da qui electron-builder genera
# anche i `latest*.yml` che l'updater interroga — sono loro il feed, non gli
# artefatti, e una Release che li dimentica non aggiorna nessuno.
#
# Pubblicare diventa: alzare `version` in package.json, costruire, caricare gli
# artefatti come Release. `version` è il numero con cui l'app installata si
# confronta, quindi lasciarlo indietro fa credere vecchia una build nuova.
publish:
  provider: github
  owner: edocico
  repo: fanta-help

# Every target pins its architectures explicitly. Without `arch`, electron-builder
# builds only for the architecture of the machine that runs it, so a build on an
# Apple Silicon Mac would silently produce arm64-only Windows and Linux installers.
win:
  target:
    - target: nsis
      arch: [x64, arm64]
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.sports
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Sports
